<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>兵牌预览 · MIL-STD-2525（milsymbol）</title>
<style>
  body { margin: 0; padding: 16px; background: #0b1220; color: #e2e8f0;
         font: 13px/1.5 system-ui, "Microsoft YaHei", sans-serif; }
  h1 { font-size: 16px; margin: 0 0 4px; color: #7cb1f0; }
  .tip { color: #94a3b8; font-size: 12px; margin-bottom: 14px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #1e293b; padding: 4px 6px; text-align: center; vertical-align: middle; }
  th { background: #0f172a; color: #64748b; font-weight: 600; font-size: 12px; position: sticky; top: 0; }
  td.name { text-align: left; white-space: nowrap; color: #cbd5e1; }
  td.sidc { font-family: Consolas, monospace; font-size: 11px; color: #475569; }
  .sym { width: 96px; height: 93px; }
  .sym svg { width: 100%; height: 100%; display: block; }
  tr:hover td { background: #0f172a; }
  .light td { background: #e8eef7; }
  .light td.name, .light td.sidc { color: #1e293b; }
</style>
</head>
<body>
<h1>兵牌预览（全部由 milsymbol 绘制）</h1>
<div class="tip">
  左列为兵种 key / 中文名，右侧四列是梯队：班(B) · 排(D) · 连(E) · 营(F)。
  第二张表是"浅色背景"下的样子（兵牌底色本来就是浅色纸）。
  哪里不对直接说：兵种 → 应该长什么样。
</div>
<div id="out"></div>

<script src="../js/ms-catalog.js"></script>
<script src="../js/data.js"></script>
<script src="../js/vendor/milsymbol.js"></script>
<script src="../js/milsymbol-bridge.js"></script>
<script src="../js/model.js"></script>
<script src="../js/render.js"></script>
<script>
(function () {
  const ECH = [['班', 'squad'], ['排', 'platoon'], ['连', 'company'], ['营', 'battalion']];
  const sel = document.createElement('select');
  sel.style.cssText = 'margin-bottom:12px;padding:5px 10px;font:inherit;border-radius:6px;' +
                      'background:#0f172a;color:#e2e8f0;border:1px solid #1e293b;';
  (typeof MS_CATALOG !== 'undefined' ? MS_CATALOG : []).forEach((c, i) => {
    const o = document.createElement('option');
    o.value = String(i);
    o.textContent = c.n + '（' + c.subs.reduce((a, s) => a + s.items.length, 0) + '）';
    sel.appendChild(o);
  });
  document.body.insertBefore(sel, document.getElementById('out'));

  function cell(sidc) {
    const type = 'ms_' + String(sidc).replace(/[^a-z0-9]/gi, '').toLowerCase();
    let svg = '';
    try { svg = buildSymbol(type, 'company', null) || ''; } catch (e) { svg = '<b style="color:#f87171">ERR</b>'; }
    return '<td class="sym">' + svg + '</td>';
  }

  function render() {
    const cat = MS_CATALOG[Number(sel.value) || 0];
    let html = '';
    for (const sub of cat.subs) {
      html += '<h1 style="margin-top:18px">' + cat.n + ' · ' + sub.n +
              '（' + sub.items.length + '）</h1>' +
              '<table><thead><tr><th>名称</th><th>SIDC</th></tr></thead><tbody>';
      for (const it of sub.items) {
        html += '<tr><td class="name">' + it.n + '</td><td class="sym">' +
                (buildSymbol('ms_' + String(it.s).replace(/[^a-z0-9]/gi, '').toLowerCase(), 'company', null) || '') +
                '</td><td class="sidc">' + it.s + '</td></tr>';
      }
      html += '</tbody></table>';
    }
    document.getElementById('out').innerHTML = html;
  }

  sel.addEventListener('change', render);
  render();
})();
</script>
</body>
</html>
